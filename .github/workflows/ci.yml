name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Configure npm
        run: |
          npm config delete registry || true
          npm config set registry https://registry.npmjs.org/
          # Clear any auth settings
          npm config delete //registry.npmjs.org/:_authToken || true
          rm -f .npmrc || true
          npm config list

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Configure npm
        run: |
          npm config delete registry || true
          npm config set registry https://registry.npmjs.org/
          # Clear any auth settings
          npm config delete //registry.npmjs.org/:_authToken || true
          rm -f .npmrc || true
          npm config list

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run TypeScript compiler
        run: npx tsc --noEmit

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Configure npm
        run: |
          npm config delete registry || true
          npm config set registry https://registry.npmjs.org/
          # Clear any auth settings
          npm config delete //registry.npmjs.org/:_authToken || true
          rm -f .npmrc || true
          npm config list

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run tests
        run: npm test -- --run

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Configure npm
        run: |
          npm config delete registry || true
          npm config set registry https://registry.npmjs.org/
          # Clear any auth settings
          npm config delete //registry.npmjs.org/:_authToken || true
          rm -f .npmrc || true
          npm config list

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Build application
        # No DB seeding needed — the libSQL client is lazy-initialised
        # (src/db/index.ts) and every Kustom API route is force-dynamic, so
        # the build never opens a connection. Prod runs against Turso.
        run: npm run build
        env:
          # Dummy keys for build (not used at build time)
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-dummy-key-for-build' }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next
          retention-days: 7
