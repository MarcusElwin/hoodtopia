# Fly.io config for the Hoodtopia MedusaJS backend.
#
# Setup (once):
#   fly launch --no-deploy --copy-config        # uses this file; pick a name/region
#   fly postgres create --name hoodtopia-db     # managed Postgres
#   fly postgres attach hoodtopia-db            # sets DATABASE_URL secret
#   fly secrets set \
#     JWT_SECRET=$(openssl rand -hex 32) \
#     COOKIE_SECRET=$(openssl rand -hex 32) \
#     STORE_CORS=https://hoodtopia.co \
#     ADMIN_CORS=https://admin.hoodtopia.co \
#     AUTH_CORS=https://hoodtopia.co,https://admin.hoodtopia.co \
#     MEDUSA_BACKEND_URL=https://api.hoodtopia.co
#   # optional Redis (event bus / workflow engine): fly secrets set REDIS_URL=...
#   fly deploy
#   fly certs add api.hoodtopia.co
#   fly certs add admin.hoodtopia.co            # admin served at /app on the same app
#
# After first deploy, seed once:
#   fly ssh console -C "npm run seed"           # from .medusa/server (the app cwd)

app = "hoodtopia-medusa"
primary_region = "arn"   # Stockholm — change to your closest region

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "9000"

[http_service]
  internal_port = 9000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    method = "get"
    path = "/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
